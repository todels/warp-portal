<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warp Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0' stop-color='%23ff9be3'/%3E%3Cstop offset='.35' stop-color='%23e85ad8'/%3E%3Cstop offset='.7' stop-color='%233b5bff'/%3E%3Cstop offset='1' stop-color='%23190e5a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0c0c10;
    --panel: #141419;
    --panel-2: #1b1b22;
    --line: #24242d;
    --line-2: #30303b;
    --text: #ececf1;
    --muted: #8b8b99;
    --faint: #5b5b68;
    --hover: #1f1f27;
    --accent: #c86bff;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", sans-serif;
    color: var(--text);
    background: var(--bg);
    display: grid;
    grid-template-columns: 1fr 304px;
    grid-template-rows: 52px 1fr;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }

  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -0.01em; font-size: 14px; }
  .logo {
    width: 20px; height: 20px; border-radius: 6px;
    background:
      radial-gradient(circle at 50% 50%, #ffd2f6 0, rgba(255,210,246,0) 22%),
      conic-gradient(from 20deg, #3b5bff, #190e5a 12%, #ff3dbe 22%, #190e5a 34%, #5a6dff 46%, #ff86dc 58%, #190e5a 70%, #2348ff 82%, #f5a6f2 92%, #3b5bff);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .spacer { flex: 1; }
  .btn {
    height: 30px; padding: 0 12px; border-radius: 7px;
    border: 1px solid var(--line-2); background: var(--panel-2);
    display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
    font-weight: 500; white-space: nowrap; user-select: none;
  }
  .btn:hover { border-color: #444452; background: #212129; }
  .btn:active { transform: translateY(0.5px); }
  .btn.primary { background: var(--text); border-color: var(--text); color: #111; }
  .btn.primary:hover { background: #fff; }
  .btn .kbd { font-family: var(--mono); font-size: 11px; opacity: .5; }
  .btn.small { height: 26px; padding: 0 9px; font-size: 12px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 7px; border: 0; background: transparent;
    display: inline-grid; place-items: center; cursor: pointer; color: var(--muted); padding: 0;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sep { width: 1px; height: 20px; background: var(--line-2); margin: 0 4px; }

  #stage { position: relative; overflow: hidden; display: grid; place-items: center; }
  #frame {
    position: relative; cursor: crosshair; touch-action: none;
    box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 20px 60px rgba(0,0,0,.5);
  }
  #frame:fullscreen { width: 100vw !important; height: 100vh !important; cursor: default; }
  #view { display: block; width: 100%; height: 100%; }
  #dot {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.9); box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    pointer-events: none; opacity: 0; transition: opacity .15s;
  }
  #frame:hover #dot, #frame.drag #dot { opacity: 1; }
  #frame:fullscreen #dot { display: none; }
  #meta {
    position: absolute; left: 0; right: 0; bottom: 12px;
    display: flex; justify-content: center; gap: 14px;
    color: var(--faint); font-size: 11.5px; pointer-events: none;
  }
  #meta b { font-family: var(--mono); font-weight: 500; color: var(--muted); }
  #toast {
    position: absolute; left: 50%; top: 16px; transform: translate(-50%, -8px);
    background: var(--text); color: #111; padding: 8px 13px; border-radius: 8px;
    font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    box-shadow: 0 6px 20px rgba(0,0,0,.3); white-space: nowrap; z-index: 5;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: #ff6b6b; }

  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2c2c36 transparent; }
  section { padding: 12px 16px 14px; border-bottom: 1px solid var(--line); }
  .sec-h { display: flex; align-items: center; justify-content: space-between; height: 24px; margin-bottom: 6px; }
  .sec-h h3 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .hint { color: var(--faint); font-size: 11.5px; margin-top: 6px; }

  #presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .preset { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; }
  .preset i {
    display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    transition: transform .12s;
  }
  .preset:hover i { transform: translateY(-1px); }
  .preset.on i { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px var(--text); }
  .preset span { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }

  .swatches { display: flex; gap: 6px; align-items: center; }
  .well {
    position: relative; width: 30px; height: 30px; border-radius: 8px; flex: none; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); cursor: pointer;
  }
  button.well { border: 0; padding: 0; }
  .well.open { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 3px var(--text); }

  .cpick {
    position: fixed; z-index: 50; width: 244px; padding: 12px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--line-2); box-shadow: 0 18px 50px rgba(0,0,0,.55);
  }
  .cpick[hidden] { display: none; }
  .cp-sv { position: relative; height: 150px; border-radius: 8px; cursor: crosshair; touch-action: none; }
  .cp-knob, .cp-hknob {
    position: absolute; width: 16px; height: 16px; border-radius: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.6); pointer-events: none;
  }
  .cp-hue {
    position: relative; height: 12px; margin: 12px 0; border-radius: 6px; cursor: pointer; touch-action: none;
    background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
  }
  .cp-hknob { top: 50%; }
  .cp-row { display: flex; gap: 6px; align-items: center; }
  .cp-cmp { display: flex; flex: none; width: 44px; height: 28px; border-radius: 7px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .cp-cmp i { flex: 1; }
  .cp-old { cursor: pointer; }
  .cp-hex {
    flex: 1; min-width: 0; height: 28px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line-2);
    background: var(--panel); color: var(--text); font: 12px var(--mono); text-transform: lowercase; outline: none;
  }
  .cp-hex:focus { border-color: var(--faint); }
  .cp-drop {
    flex: none; width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel);
    color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .cp-drop:hover { color: var(--text); background: var(--hover); }
  .cp-drop[hidden] { display: none; }
  .cp-drop svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .cp-lbl { margin: 10px 0 5px; font-size: 10.5px; color: var(--faint); }
  .cp-sw { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .cp-sw button {
    aspect-ratio: 1; border: 0; padding: 0; border-radius: 5px; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .cp-sw button:hover { box-shadow: 0 0 0 1.5px var(--text); }
  .swatches .lbl { font-size: 11px; color: var(--faint); width: 30px; text-align: center; }
  .swrow { display: grid; grid-template-columns: repeat(7, 30px); gap: 6px; justify-content: space-between; }
  .swrow .cap { font-size: 10.5px; color: var(--faint); text-align: center; margin-top: 3px; }
  .swrow .gap { width: 1px; }

  .row { display: grid; grid-template-columns: 84px 1fr 44px; align-items: center; gap: 8px; height: 28px; }
  .row label { color: var(--muted); cursor: default; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row label:hover { color: var(--text); }
  .row .val { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer;
    --p: 50%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 4px; border-radius: 2px;
    background: linear-gradient(90deg, #8a8a99 0 var(--p), #2c2c36 var(--p) 100%);
  }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #2c2c36; }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: #8a8a99; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; margin-top: -5px;
    background: #f2f2f6; box-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #f2f2f6; }
  input[type=range]:focus { outline: none; }

  .seg { display: inline-flex; background: #0f0f14; border: 1px solid var(--line-2); border-radius: 7px; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 3px 9px; border-radius: 5px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .seg button.on { background: #2a2a34; color: var(--text); }
  .line { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .line > label { color: var(--muted); width: 84px; flex: none; }
  .num {
    width: 64px; height: 26px; border-radius: 6px; border: 1px solid var(--line-2); background: #0f0f14;
    padding: 0 7px; font-family: var(--mono); font-size: 12px;
  }
  .num:focus, select:focus { outline: none; border-color: #555564; }
  select {
    height: 26px; border-radius: 6px; border: 1px solid var(--line-2); background: #0f0f14; padding: 0 6px; font-size: 12px; flex: 1;
  }
  .times { color: var(--faint); }
  .switch { position: relative; width: 30px; height: 18px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 9px; background: #2c2c36; transition: background .15s; }
  .switch span::after { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #f2f2f6; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(12px); }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  .btns .btn { flex: 1; justify-content: center; }

  #modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.55); z-index: 10; }
  #modal.show { display: grid; }
  .card { width: 340px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .card h4 { margin: 0 0 4px; font-size: 14px; }
  .card p { margin: 0 0 12px; color: var(--muted); }
  .bar { height: 6px; border-radius: 3px; background: #2c2c36; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .card .btn { margin-top: 14px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"></span>Warp Portal</div>
  <div class="spacer"></div>
  <button class="icon-btn" id="playBtn" title="Play / pause (Space)"></button>
  <button class="icon-btn" id="fsBtn" title="Fullscreen (F)"><svg class="i" viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
  <span class="sep"></span>
  <button class="btn" id="seedBtn" title="New random layout (R)"><svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><circle cx="5.8" cy="5.8" r=".6" fill="currentColor"/><circle cx="10.2" cy="10.2" r=".6" fill="currentColor"/><circle cx="8" cy="8" r=".6" fill="currentColor"/></svg>Shuffle</button>
  <button class="btn" id="codeBtn" title="Copy an HTML snippet with the current settings"><svg class="i" viewBox="0 0 16 16"><path d="M5.5 4.5 2 8l3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></svg>Copy code</button>
  <button class="btn" id="pngBtn" title="Copy a PNG at the export size (paste in Figma)">Copy PNG <span class="kbd">⌘C</span></button>
  <button class="btn primary" id="mp4Btn">Export MP4</button>
</header>

<main id="stage">
  <div id="frame"><canvas id="view"></canvas><div id="dot"></div></div>
  <div id="meta"></div>
  <div id="toast"></div>
</main>

<aside id="panel"></aside>

<div id="modal"><div class="card">
  <h4 id="mTitle">Exporting</h4>
  <p id="mText">Preparing…</p>
  <div class="bar"><i id="mBar"></i></div>
  <button class="btn small" id="mCancel">Cancel</button>
</div></div>

<script type="module" src="app.js?v=4"></script>
</body>
</html>
